# reusable ESM — host-visible names stay
[javascript]
# 8.103: converged naming, measured -15 Brotli on this port against the current
# compiler. Swept fleet-wide the knob is net positive, so it lands per port.
# The earlier sweep of it predates live-17..23; a refused measurement has a
# shelf life when the compiler moves under it.
name_ordering = "idiom-converged"
priority = "size-first"
# 8.90: level 12 -> 15, measured -33 Brotli on this port's own
# artifact. Swept across the fleet the level is nearly inert (-160 over 22,
# and katexlil and react-markdownlil do not move at all), so it lands per
# port where it pays rather than as a default.
optimization_level = 15

cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
local_name_reserve = 48
candidate_search = "off"
function_spelling = "arrow"
public_aggregate_abi = "named"

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = true
pool_strings = true
